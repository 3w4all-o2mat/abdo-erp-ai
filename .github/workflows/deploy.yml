name: Deploy to VPS

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  IMAGE_NAME: abdo-erp
  VPS_DEPLOY_DIR: /home/ubuntu/abdo-erp
  VPS_PORT: 3000

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"
      ACTIONS_NODE_VERSION: "22"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: ${{ runner.os }}-buildx-

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: Prepare SSH key
        if: always()
        run: |
          set -e
          mkdir -p ~/.ssh
          printf '%s' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true
          echo "SSH key ready."

      # ---------------------------------------------------------------
      # Run everything on the VPS in a single SSH session.
      #
      # The VPS already has a git clone of this repo at
      # $VPS_DEPLOY_DIR. So we just:
      #   1. cd into the clone
      #   2. git fetch + reset to the current commit (so deploy.sh and
      #      docker-compose.yml are always the version being deployed)
      #   3. load the new Docker image (already streamed to the VPS
      #      via a separate step above)
      #   4. run scripts/deploy.sh
      # ---------------------------------------------------------------
      - name: Run deploy on VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 15m
          envs: NEW_IMAGE,NEW_TAG,PORT,COMMIT,DEPLOYED_AT
          script: |
            set -e
            DEPLOY_DIR="${{ env.VPS_DEPLOY_DIR }}"

            echo "=== Pre-flight ==="
            echo "PWD: $(pwd)"
            echo "DEPLOY_DIR: $DEPLOY_DIR"
            if [ ! -d "$DEPLOY_DIR" ]; then
              echo "ERROR: $DEPLOY_DIR does not exist on the VPS."
              echo "       Please run the one-time VPS setup from docs/SETUP_VPS.md first."
              exit 1
            fi
            cd "$DEPLOY_DIR"

            echo "=== Pulling latest scripts/deploy.sh and docker-compose.yml ==="
            # Fetch the exact commit being deployed. This is the most
            # robust way to ensure deploy.sh matches the image we're
            # about to start.
            git fetch origin "${{ github.ref_name }}" --depth=1
            git checkout FETCH_HEAD -- scripts/deploy.sh docker-compose.yml
            chmod +x scripts/deploy.sh

            echo "=== Running deploy.sh ==="
            NEW_IMAGE="${{ env.IMAGE_NAME }}:${{ github.sha }}" \
            NEW_TAG="${{ github.sha }}" \
            PORT="${{ env.VPS_PORT }}" \
            COMMIT="${{ github.sha }}" \
            DEPLOYED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              bash "$DEPLOY_DIR/scripts/deploy.sh"

      - name: Cleanup SSH key
        if: always()
        run: |
          rm -f ~/.ssh/deploy_key
          echo "SSH key removed from runner."
