name: Deploy to VPS

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  IMAGE_NAME: abdo-erp
  VPS_DEPLOY_DIR: /home/ubuntu/abdo-erp
  VPS_PORT: 3000

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"
      ACTIONS_NODE_VERSION: "22"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: ${{ runner.os }}-buildx-

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: Prepare SSH key
        if: always()
        run: |
          set -e
          mkdir -p ~/.ssh
          printf '%s' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true
          echo "SSH key ready."

      - name: Run deploy on VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 15m
          envs: NEW_IMAGE,NEW_TAG,PORT,COMMIT,DEPLOYED_AT
          script: |
            # NOTE: no `set -e` here on purpose — we want to see the
            # full output of every step so it's clear where it fails.
            DEPLOY_DIR="${{ env.VPS_DEPLOY_DIR }}"
            SHA="${{ github.sha }}"
            RAW="https://raw.githubusercontent.com/${{ github.repository }}/$SHA"

            echo "============================================================"
            echo "  abdo-erp deploy"
            echo "  IMAGE : ${{ env.IMAGE_NAME }}:$SHA"
            echo "  DIR   : $DEPLOY_DIR"
            echo "  PORT  : ${{ env.VPS_PORT }}"
            echo "============================================================"

            echo ""
            echo "--- 1. Pre-flight: target directory ---"
            if [ ! -d "$DEPLOY_DIR" ]; then
              mkdir -p "$DEPLOY_DIR"
              echo "       created $DEPLOY_DIR (was missing)"
            else
              echo "       $DEPLOY_DIR already exists"
            fi
            cd "$DEPLOY_DIR"
            echo "       PWD: $(pwd)"

            echo ""
            echo "--- 2. Pre-flight: curl/wget ---"
            if command -v curl >/dev/null 2>&1; then
              DL=curl
            elif command -v wget >/dev/null 2>&1; then
              DL=wget
            else
              echo "       ERROR: neither curl nor wget is available on the VPS"
              exit 1
            fi
            echo "       using: $DL"

            echo ""
            echo "--- 3. Download deploy.sh ---"
            if [ "$DL" = "curl" ]; then
              curl -fsSL -o deploy.sh "$RAW/scripts/deploy.sh"
            else
              wget -q -O deploy.sh "$RAW/scripts/deploy.sh"
            fi
            echo "       deploy.sh: $(ls -la deploy.sh)"

            echo ""
            echo "--- 4. Download docker-compose.yml ---"
            if [ "$DL" = "curl" ]; then
              curl -fsSL -o docker-compose.yml "$RAW/docker-compose.yml"
            else
              wget -q -O docker-compose.yml "$RAW/docker-compose.yml"
            fi
            echo "       docker-compose.yml: $(ls -la docker-compose.yml)"

            chmod +x deploy.sh

            echo ""
            echo "--- 5. Run deploy.sh ---"
            NEW_IMAGE="${{ env.IMAGE_NAME }}:$SHA" \
            NEW_TAG="$SHA" \
            PORT="${{ env.VPS_PORT }}" \
            COMMIT="$SHA" \
            DEPLOYED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              bash "$DEPLOY_DIR/deploy.sh"
            DEPLOY_EXIT=$?
            echo ""
            echo "============================================================"
            if [ "$DEPLOY_EXIT" -eq 0 ]; then
              echo "  Deploy SUCCEEDED."
            else
              echo "  Deploy FAILED with exit code $DEPLOY_EXIT."
              echo "  See errors above."
            fi
            echo "============================================================"
            exit $DEPLOY_EXIT

      - name: Cleanup SSH key
        if: always()
        run: |
          rm -f ~/.ssh/deploy_key
          echo "SSH key removed from runner."
