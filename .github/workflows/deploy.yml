name: Deploy to VPS

on:
  push:
    branches: [main, master]
  workflow_dispatch:        # manual trigger from the Actions tab

env:
  IMAGE_NAME: abdo-erp
  VPS_DEPLOY_DIR: /home/ubuntu/abdo-erp
  VPS_PORT: 3000

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      # The runner ships Node 24 by default; this workflow only uses
      # Docker + SSH (no JS), so the Node 20 deprecation notice is
      # informational. Acknowledged per:
      # https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"
      ACTIONS_NODE_VERSION: "22"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Speed up rebuilds by caching layers in the GitHub Actions cache.
      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: ${{ runner.os }}-buildx-

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true                 # load into the runner's Docker daemon
          push: false
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      # ----------------------------------------------------------------
      # SSH key is written to a temp file on the runner and removed at
      # the end. Using appleboy/ssh-action@v1 (actively maintained)
      # for all command execution on the VPS.
      # ----------------------------------------------------------------
      - name: Prepare SSH key
        if: always()
        run: |
          set -e
          mkdir -p ~/.ssh
          printf '%s' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true
          echo "SSH key ready."

      - name: Ensure deploy directory exists on VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: mkdir -p ${{ env.VPS_DEPLOY_DIR }} && echo "VPS OK"

      - name: Upload compose + deploy script to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "docker-compose.yml,scripts/deploy.sh"
          target: ${{ env.VPS_DEPLOY_DIR }}

      # Stream the new image directly to the VPS Docker daemon.
      # This avoids storing the tarball as a GitHub Actions artifact.
      - name: Transfer Docker image to VPS
        run: |
          set -e
          echo "Streaming image ${{ env.IMAGE_NAME }}:${{ github.sha }} to ${{ secrets.VPS_HOST }}..."
          docker save \
            ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            ${{ env.IMAGE_NAME }}:latest \
            | gzip \
            | ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
                ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
                "set -e; gunzip | docker load; echo IMAGE_LOADED_OK"

      - name: Run deploy on VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 15m
          script: |
            set -e
            cd ${{ env.VPS_DEPLOY_DIR }}
            chmod +x ./deploy.sh
            NEW_IMAGE=${{ env.IMAGE_NAME }}:${{ github.sha }} \
            NEW_TAG=${{ github.sha }} \
            PORT=${{ env.VPS_PORT }} \
            COMMIT=${{ github.sha }} \
            DEPLOYED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
              bash ./deploy.sh

      - name: Cleanup SSH key
        if: always()
        run: |
          rm -f ~/.ssh/deploy_key
          echo "SSH key removed from runner."
