# =============================================================================
# abdo-ai-erp — CI/CD
#
# Every push to `master` (or `main`):
#   1. `ci`      — typecheck + production build on a GitHub runner
#                  (acts as a regression gate; nothing is deployed if it fails)
#   2. `deploy`  — SSH into the VPS, `git pull`, then run `scripts/deploy.sh`
#                  which builds the image locally on the VPS with
#                  `docker compose`, applies Prisma migrations and restarts
#                  the `app` container.
#
# Required GitHub repository secrets:
#   VPS_HOST    - public IP / hostname of the VPS
#   VPS_USER    - SSH user (e.g. `ubuntu`)
#   VPS_SSH_KEY - private key of the GitHub Actions deploy key
#                 (see docs/SETUP_VPS.md and DEPLOY.md)
# =============================================================================
name: Build and Deploy

on:
  push:
    branches: [master, main]
  workflow_dispatch:

env:
  VPS_DEPLOY_DIR: /home/ubuntu/abdo-erp

jobs:
  ci:
    name: CI — typecheck & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node.js (caches pnpm store)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build
        env:
          # Dummy values so `prisma generate` / `next build` don't need a DB.
          # Pages that query the DB are force-dynamic, so the build won't
          # actually connect to any of these.
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          AUTH_SECRET: ci-only-dummy-secret
          NEXTAUTH_SECRET: ci-only-dummy-secret
          NEXTAUTH_URL: http://localhost:3000

  deploy:
    name: Deploy to VPS
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd "${{ env.VPS_DEPLOY_DIR }}"
            git pull --ff-only
            chmod +x scripts/deploy.sh
            ./scripts/deploy.sh
