name: Deploy to VPS

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  IMAGE_NAME: abdo-erp
  REGISTRY_IMAGE: ghcr.io/${{ github.repository }}
  VPS_DEPLOY_DIR: /home/ubuntu/abdo-erp
  VPS_PORT: 3000

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    permissions:
      contents: read
      packages: write   # required to push to GHCR

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: ${{ runner.os }}-buildx-

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY_IMAGE }}:${{ github.sha }}
            ${{ env.REGISTRY_IMAGE }}:latest
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: Prepare SSH key
        if: always()
        run: |
          set -e
          mkdir -p ~/.ssh
          printf '%s' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true
          echo "SSH key ready."

      - name: Run deploy on VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 15m
          script: |
            set -e
            DEPLOY_DIR="${{ env.VPS_DEPLOY_DIR }}"
            RAW_BASE="https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}"

            echo "=== Pre-flight ==="
            echo "DEPLOY_DIR: $DEPLOY_DIR"
            echo "RAW_BASE:   $RAW_BASE"
            if [ ! -d "$DEPLOY_DIR" ]; then
              mkdir -p "$DEPLOY_DIR"
              echo "       created (was missing)."
            fi
            cd "$DEPLOY_DIR"

            echo "=== Downloading deploy.sh and docker-compose.yml from GitHub ==="
            if command -v curl >/dev/null 2>&1; then
              curl -fsSL -o deploy.sh        "$RAW_BASE/scripts/deploy.sh"
              curl -fsSL -o docker-compose.yml "$RAW_BASE/docker-compose.yml"
            elif command -v wget >/dev/null 2>&1; then
              wget -q -O deploy.sh        "$RAW_BASE/scripts/deploy.sh"
              wget -q -O docker-compose.yml "$RAW_BASE/docker-compose.yml"
            else
              echo "ERROR: neither curl nor wget is available on the VPS" >&2
              exit 1
            fi
            chmod +x deploy.sh
            echo "       deploy.sh:        $(ls -la deploy.sh)"
            echo "       docker-compose.yml: $(ls -la docker-compose.yml)"

            echo "=== Logging in to GHCR on VPS ==="
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            echo "=== Pulling image ==="
            docker pull "${{ env.REGISTRY_IMAGE }}:${{ github.sha }}"

            echo "=== Running deploy.sh ==="
            NEW_IMAGE="${{ env.REGISTRY_IMAGE }}:${{ github.sha }}" \
            NEW_TAG="${{ github.sha }}" \
            PORT="${{ env.VPS_PORT }}" \
            COMMIT="${{ github.sha }}" \
            DEPLOYED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              bash "$DEPLOY_DIR/deploy.sh"