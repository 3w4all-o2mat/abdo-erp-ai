services:
  postgres:
    image: postgres:16-alpine
    container_name: abdo_erp_postgres
    restart: unless-stopped
    volumes:
      - ./postgres_data:/var/lib/postgresql/data 
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    networks:
      - app_network


  app:
    image: ghcr.io/3w4all-o2mat/abdo-erp-ai:latest
    container_name: abdo-erp
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: "0.0.0.0"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    labels:
      - "com.abdo-erp.commit=${COMMIT:-unknown}"
      - "com.abdo-erp.deployed-at=${DEPLOYED_AT:-unknown}"
    # Mount the host's ./public/ folder so static assets (logo, favicon, etc.)
    # are served from the VPS filesystem instead of being baked into the image.
    # The image still ships an empty /app/public/ as a safety net.
    volumes:
      - ./public:/app/public
    depends_on:
      - postgres

networks:
  app_network:
    driver: bridge