services:
  postgres:
    image: postgres:16-alpine
    container_name: abdo_erp_postgres
    restart: unless-stopped
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    # POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB come from .env.production
    env_file:
      - .env.production
    healthcheck:
      # $$POSTGRES_USER / $$POSTGRES_DB -> expanded inside the container at
      # runtime (the escaping prevents docker compose from interpolating them).
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - app_network

  app:
    # Image is built locally on the VPS (docker compose build app) — no GHCR
    # pull needed. `image:` is just the local tag used by compose.
    build:
      context: .
      dockerfile: Dockerfile
    image: abdo-erp-ai:local
    container_name: abdo-erp
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: "0.0.0.0"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    labels:
      - "com.abdo-erp.commit=${COMMIT:-unknown}"
      - "com.abdo-erp.deployed-at=${DEPLOYED_AT:-unknown}"
    # Mount the host's ./public/ folder so static assets (logo, favicon, etc.)
    # are served from the VPS filesystem instead of being baked into the image.
    # The image still ships an empty /app/public/ as a safety net.
    volumes:
      - ./public:/app/public
    depends_on:
      postgres:
        condition: service_healthy

networks:
  app_network:
    driver: bridge